let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return xlsxLoading||(xlsxLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxLoading=null;s.remove();rej(new Error('NO_XLSX'))};document.head.appendChild(s)}));
}
async function readProvWorkbook(){
  const f=await getFeed('prov');
  const bin=atob(f.base64),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(bytes[0]!==0x50||bytes[1]!==0x4B)throw new Error('NOT_XLSX'); // .xlsx files start with "PK"
  const X=await loadXLSX();
  return{X,wb:X.read(bytes.buffer,{type:'array'}),f};
}
// Every class column in the calendar, per sheet (ÅK 1, ÅK 2, …) — for the class picker.
function listClasses(XLSX,wb){
  const out=[];
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];if(!ws['!ref'])continue;
    const rng=XLSX.utils.decode_range(ws['!ref']);
    const raw=(r,c)=>{const x=ws[XLSX.utils.encode_cell({r,c})];return x?String(x.v??'').trim():''};
    for(let r=rng.s.r;r<=Math.min(rng.s.r+6,rng.e.r);r++){
      const row=[];for(let c=rng.s.c;c<=rng.e.c;c++)row.push(raw(r,c));
      if(!row.some(v=>/^(vecka|datum|week|date)$/i.test(v)))continue;
      const classes=row.filter(v=>v&&v.length<=12&&!/^(vecka|dag|datum|week|day|date)$/i.test(v)&&!/^för alla/i.test(v));
      if(classes.length)out.push({sheet:name,classes});
      break;
    }
  }
  return out;
}
const serialDate=n=>{const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
function isoWeekDate(y,w,day){const j4=new Date(y,0,4);const mon=new Date(y,0,4-((j4.getDay()+6)%7));mon.setDate(mon.getDate()+7*(w-1)+(day-1));return ds(mon)}
const DAYNUM={'måndag':1,'tisdag':2,'onsdag':3,'torsdag':4,'fredag':5,'lördag':6,'söndag':7,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5};
// ----- Modern languages: keep only the language you study -----
// Cells often list every language group, e.g. "Sp höra /AEKI, Ty höra ÅAN, FrKBt, SV1: Informerande tal".
const LANGS={
  fr:{name:'Franska',codes:['Franska','franska','Fr','FR','fr']},
  sp:{name:'Spanska',codes:['Spanska','spanska','Spa','Sp','SP','sp']},
  ty:{name:'Tyska',codes:['Tyska','tyska','Ty','TY','ty']},
  it:{name:'Italienska',codes:['Italienska','italienska','Ita','ITA','ita']}
};
function langOf(part){
  for(const [k,l] of Object.entries(LANGS))for(const c of l.codes){
    if(!part.startsWith(c))continue;
    const nx=part.charAt(c.length);
    if(nx===''||/[\s.:\/,(\-]/.test(nx)||/[A-ZÅÄÖ]/.test(nx))return{k,rest:part.slice(c.length)};
  }
  return null;
}
const activityOf=s=>s.split(/[\s\/:.,()\-]+/).filter(w=>/^[A-ZÅÄÖa-zåäö][a-zåäö]{2,}$/.test(w)).map(w=>w.toLowerCase()).join(' ');
function filterLang(title,lang){
  if(!lang||!LANGS[lang])return title;
  const groups=title.split(/\s*\+\s*/).map(g=>g.split(/\s*,\s*/));
  let borrowed=''; // e.g. "FrKBt" next to "Sp höra" → "Franska höra"
  for(const g of groups)for(const p of g){const L=langOf(p);if(L&&L.k!==lang&&!borrowed)borrowed=activityOf(L.rest)}
  return groups.map(g=>g.map(p=>{
    const L=langOf(p);if(!L)return p;
    if(L.k!==lang)return null;
    const act=activityOf(L.rest)||borrowed;
    return LANGS[lang].name+(act?' '+act:'');
  }).filter(p=>p&&p.trim()).join(', ')).filter(Boolean).join(' + ');
}
// Only the language you study should be a subject. "Moderna språk" (or another language that only has
// calendar items in it) is renamed to yours; other language subjects left empty are removed.
// Subjects holding your own work or grades are never touched.
const LANG_SUBJECTS=()=>[...Object.values(LANGS).map(l=>l.name),'Moderna språk'];
const hasOwnWork=s=>state.tasks.some(t=>t.subjectId===s.id&&(!(t.source||'').startsWith('prov:')||t.grade||pct(t)!=null));
function renameLanguageSubject(lang){
  const mine=LANGS[lang]?.name;if(!mine||state.subjects.some(s=>s.name===mine))return;
  const old=state.subjects.find(s=>LANG_SUBJECTS().includes(s.name)&&s.name!==mine&&!hasOwnWork(s));
  if(old)old.name=mine;
}
function removeOtherLanguageSubjects(lang){
  const mine=LANGS[lang]?.name;if(!mine)return;
  state.subjects=state.subjects.filter(s=>!(LANG_SUBJECTS().includes(s.name)&&s.name!==mine&&!state.tasks.some(t=>t.subjectId===s.id)));
}
// Reads the sheet that has the class as a column header. Rows: Vecka (week) | Dag (day) | Datum (date) | one column per class.
function parseProv(XLSX,wb,cls,includeAll,lang){
  const want=cls.toUpperCase().replace(/\s+/g,'');
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name];if(!ws['!ref'])continue;
    const rng=XLSX.utils.decode_range(ws['!ref']);
    const merged={},wide=new Set();
    const raw=(r,c)=>{const x=ws[XLSX.utils.encode_cell({r,c})];return x?x.v:undefined};
    for(const m of ws['!merges']||[]){const v=raw(m.s.r,m.s.c);const isWide=m.e.c-m.s.c>=8;
      for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++){merged[r+','+c]=v;if(isWide)wide.add(r+','+c)}}
    const val=(r,c)=>{if(c<0)return undefined;const v=raw(r,c);return v!==undefined&&v!==''?v:merged[r+','+c]};
    let hdr=-1,col=-1;
    for(let r=rng.s.r;r<=Math.min(rng.s.r+6,rng.e.r)&&col<0;r++)
      for(let c=rng.s.c;c<=rng.e.c;c++)if(String(raw(r,c)??'').toUpperCase().replace(/\s+/g,'')===want){hdr=r;col=c;break}
    if(col<0)continue;
    let wkC=-1,dayC=-1,dateC=-1,allC=-1;
    for(let c=rng.s.c;c<=rng.e.c;c++){const h=String(raw(hdr,c)??'').trim().toLowerCase();
      if(h==='vecka'||h==='week')wkC=c;else if(h==='dag'||h==='day')dayC=c;else if(h==='datum'||h==='date')dateC=c;else if(h.startsWith('för alla'))allC=c}
    // School year starts in the autumn: weeks 30+ belong to the first year, weeks 1–29 to the next.
    let startYear=null;
    for(let r=hdr+1;r<=rng.e.r&&startYear==null;r++){const v=val(r,dateC);if(typeof v==='number'){const d=serialDate(v);startYear=+d.slice(0,4)-(+d.slice(5,7)<7?1:0)}}
    if(startYear==null)startYear=new Date().getMonth()<6?new Date().getFullYear()-1:new Date().getFullYear();
    const events=[],perDay={};let week=null,last=null;
    const push=(text,date,key)=>{
      const title=filterLang(String(text).replace(/\s+/g,' ').replace(/[\s,;]+$/,'').trim(),lang);if(!title||!date)return;
      const k=key+'|'+date;perDay[k]=(perDay[k]||0)+1;
      events.push({title,due:date,time:'',notes:`From the school test calendar (${name})`,uid:`${k}|${perDay[k]}`,cat:'',loc:''});
    };
    for(let r=hdr+1;r<=rng.e.r;r++){
      const wk=val(r,wkC);if(wk!==undefined&&/^\d{1,2}$/.test(String(wk).trim()))week=+wk;
      const dn=DAYNUM[String(val(r,dayC)??'').trim().toLowerCase()];
      let date=null;
      if(week&&dn)date=isoWeekDate(week>=30?startYear:startYear+1,week,dn);
      else{const v=val(r,dateC);if(typeof v==='number')date=serialDate(v)}
      if(date)last=date;else date=last;
      const v=val(r,col);
      if(v!==undefined&&(includeAll||!wide.has(r+','+col)))push(v,date,want);
      if(includeAll&&allC>=0){const a=val(r,allC);if(a!==undefined&&!wide.has(r+','+allC))push(a,date,'ALL')}
    }
    return{sheet:name,events};
  }
  throw new Error('CLASS_NOT_FOUND');
}
async function syncProv(){
  const p=state.settings.prov;
  const {X,wb,f}=await readProvWorkbook();
  renameLanguageSubject(p.lang);
  const {sheet,events}=parseProv(X,wb,p.cls,p.includeAll,p.lang);
  const r=mergeEvents(events,'prov:',true);
  removeOtherLanguageSubjects(p.lang);
  // Tests whose day has passed have happened — mark them done so they move to "Waiting for a grade".
  const t0=todayStr();
  for(const t of state.tasks)if((t.source||'').startsWith('prov:')&&t.due&&t.due<t0&&t.status!=='done'&&!t.reopened){t.status='done';t.completedAt=parse(t.due).getTime();t.autoDone=true}
  Object.assign(p,{sheet,count:events.length,lastSync:f.fetchedAt||Date.now(),error:''});
  return r;
}
async function syncIts(){
  const f=await getFeed('its');
  if(!/BEGIN:VCALENDAR/i.test(f.text||''))throw new Error('NOT_ICS');
  const r=mergeEvents(parseICS(f.text),'its:');
  state.settings.lastSync=f.fetchedAt||Date.now();state.settings.syncError='';
  return r;
}
const hasSources=()=>!!(state.settings.icalUrl||state.settings.prov?.url);
async function syncAll(manual){
  if(!hasSources()||syncing)return;
  syncing=true;setSyncUI();
  const started=Date.now(),tot={added:0,updated:0,removed:0},errs=[];
  const add=r=>{tot.added+=r.added;tot.updated+=r.updated;tot.removed+=r.removed||0};
  try{
    if(state.settings.icalUrl&&!WEB){try{add(await syncIts())}catch(e){state.settings.syncError=e.message||'FETCH_FAILED';errs.push(syncMsg(state.settings.syncError))}}
    if(state.settings.prov?.url){try{add(await syncProv())}catch(e){state.settings.prov.error=e.message||'FETCH_FAILED';errs.push(syncMsg(state.settings.prov.error))}}
    save();
    if(errs.length){if(manual)toast(errs[0])}
    else if(manual||tot.added||tot.updated||tot.removed){
      const bits=[tot.added&&`${tot.added} new`,tot.updated&&`${tot.updated} moved or renamed`,tot.removed&&`${tot.removed} removed`].filter(Boolean);
      toast(bits.length?'From the school calendar: '+bits.join(', '):'Everything is up to date');
    }
  }finally{
    await new Promise(r=>setTimeout(r,Math.max(0,500-(Date.now()-started))));
    syncing=false;
    const typing=document.activeElement&&$('#view').contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!typing)render(false);else setSyncUI();
  }
}
// ----- School lunch (matsedel) -----
// Skips the vegetarian option and "kockarnas val".
let menuCache=null;
function menuDays(){
  const m=feedData?.menu;if(!m||!m.json)return null;
  if(menuCache&&menuCache.src===m.json)return menuCache.days;
  let d;try{d=JSON.parse(m.json)}catch(e){return null}
  const days={};
  for(const meal of d.meals||[]){
    const date=String(meal.date||'').slice(0,10);if(!/^\d{4}-\d\d-\d\d$/.test(date))continue;
    const day=days[date]||(days[date]={dishes:[],holiday:null});
    if(meal.holidayName)day.holiday=meal.holidayName;
    if(/vegetar/i.test(meal.name||''))continue;
    for(const c of meal.courses||[]){
      const n=String(c.name||'').replace(/\s+/g,' ').trim();
      if(!n||/kockarnas val/i.test(n)||/vegetar/i.test(c.optionName||''))continue;
      day.dishes.push(n.charAt(0).toUpperCase()+n.slice(1));
    }
  }
  menuCache={src:m.json,days};
  return days;
}
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const j4=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7)}
function lunchCard(){
  const days=menuDays();if(!days)return'';
  const t0=todayStr(),dow=(parse(t0).getDay()+6)%7;
  let mon=addDays(t0,-dow);if(dow>=5)mon=addDays(mon,7); // on weekends, show next week
  let rows='',any=false;
  for(let i=0;i<5;i++){
    const d=addDays(mon,i),day=days[d];
    const text=day?(day.holiday?`<span class="hol">${esc(day.holiday)}</span>`:esc(day.dishes.join(' · '))):'';
    if(text)any=true;
    rows+=`<div class="lunch-row ${d===t0?'is-today':''} ${d<t0?'past':''}"><span class="ld">${d===t0?'Today':fmt(d,{weekday:'short'})}</span><span>${text||'<span class="hol">–</span>'}</span></div>`;
  }
  if(!any)return'';
  return `<section class="card"><div class="card-head"><h2>Lunch</h2><span class="muted small" style="font-weight:700">Week ${isoWeek(mon)}</span></div><div class="lunch">${rows}</div></section>`;
}

let setup=null;
function openSetup(step=0,fresh=false,closable=false){
  const s=state.settings;
  const cls=fresh?'':(s.prov?.cls||''),lang=fresh?'':(s.prov?.lang||'');
  setup={step,dir:1,fresh,closable,initialCls:cls,classes:null,loading:false,error:'',
    data:{name:fresh?'':(s.name||''),cls,lang,showLunch:fresh?true:showLunch(),theme:fresh?'system':(s.theme||'system')}};
  let el=$('#setup');
  if(!el){el=document.createElement('div');el.id='setup';el.className='setup';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.appendChild(el)}
  document.body.classList.add('modal-open');
  renderSetup();loadClasses();
}
async function loadClasses(){
  if(!setup||setup.classes||setup.loading)return;
  setup.loading=true;if(setup.step===1)renderSetup();
  try{
    const d=await loadDataFile();
    if(!d?.prov)throw new Error('NEEDS_HELPER');
    if(d.prov.error)throw new Error(d.prov.error);
    const {X,wb}=await readProvWorkbook();
    if(setup)setup.classes=listClasses(X,wb);
  }catch(e){if(setup){setup.classes=[];setup.error=e.message||'FETCH_FAILED'}}
  if(setup){setup.loading=false;if(setup.step===1)renderSetup();if(setup.step===2&&!$('#su-lunch')&&feedData?.menu)renderSetup()}
}

function renderSetup(){
  const el=$('#setup');if(!el||!setup)return;
  const st=setup.step,D=setup.data,hasMenu=!!feedData?.menu;
  const dots=`<div class="setup-dots">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`;
  const back=`<button class="btn btn-ghost" data-action="su-back">Back</button>`;
  const next=(label='Continue',dis=false)=>`<button class="btn btn-primary" data-action="su-next" ${dis?'disabled':''}>${label} ${ic('arrow',18)}</button>`;
  let body='',foot='';
  if(st===0){
    body=`<div class="setup-art">${ART.plant}</div><h1>Welcome to Studyboard</h1><p class="lead">A calm little place for your homework, tests and grades. Let’s set it up — it only takes a minute.</p>
      <div class="field"><label for="su-name">What should we call you?</label><input class="input" id="su-name" value="${esc(D.name)}" placeholder="Your first name (optional)" autocomplete="given-name"></div>`;
    foot=`<span></span>${next('Let’s go')}`;
  }else if(st===1){
    body=`<h1>Your class</h1><p class="lead">Studyboard can fill in tests and hand-ins from the school’s test calendar.</p>${classPicker()}`;
    const ready=setup.classes&&setup.classes.length;
    foot=`${back}<div class="btn-row"><button class="btn btn-quiet" data-action="su-skip">Skip</button>${ready?next('Continue',!D.cls):''}</div>`;
  }else if(st===2){
    const looks=[['light','Light','#f5efe6','#fffcf7','#a9532f'],['dark','Dark','#1d1a16','#28231e','#e3916a'],['system','Auto','#f5efe6','#1d1a16','#a9532f']];
    body=`<h1>Make it yours</h1><p class="lead">Pick a look. You can change it any time in Settings.</p>
      <div class="choice-grid">${looks.map(([k,l,a,b,c])=>`<button class="choice ${D.theme===k?'on':''}" data-action="su-theme" data-v="${k}"><span class="sw"><i style="background:${a}"></i><i style="background:${b}"></i><i style="background:${c};flex:.45"></i></span>${l}</button>`).join('')}</div>
      ${hasMenu?`<label class="toggle-row"><span><b>Show the school lunch</b><small>This week’s menu on your home page.</small></span><input type="checkbox" class="switch" id="su-lunch" ${D.showLunch?'checked':''}></label>`:''}`;
    foot=`${back}${next()}`;
  }else{
    const items=[
      D.cls?`Tests and hand-ins for <b>${esc(D.cls)}</b> will show up by themselves.`:'Add your own homework and tests with the <b>New assignment</b> button.',
      D.cls&&LANGS[D.lang]?`Language tests are filtered to <b>${LANGS[D.lang].name}</b>.`:'',
      hasMenu&&D.showLunch?'This week’s lunch is on your home page.':'',
      WEB?'Tip: add Studyboard to your home screen (in Safari: Share → <b>Add to Home Screen</b>) so it opens like an app.':'Open Studyboard with <b>Start Studyboard</b> so everything stays up to date.'
    ].filter(Boolean);
    body=`<div class="setup-art">${ART.mug}</div><h1>All set${D.name.trim()?', '+esc(D.name.trim()):''}!</h1>
      <ul class="done-list">${items.map(x=>`<li>${ic('check',18)}<span>${x}</span></li>`).join('')}</ul>`;
    foot=`${back}<button class="btn btn-primary" data-action="su-finish">Open my Studyboard</button>`;
  }
  el.innerHTML=`<div class="setup-card">${setup.closable?`<button class="icon-btn setup-close" data-action="su-close" aria-label="Close">${ic('x')}</button>`:''}${dots}<div class="step ${setup.dir<0?'back':''}">${body}</div><div class="setup-foot">${foot}</div></div>`;
  if(st===0&&matchMedia('(min-width:901px)').matches)setTimeout(()=>$('#su-name')?.focus(),60);
}
function closeSetup(){
  const el=$('#setup');setup=null;
  if(!el)return;
  el.classList.add('closing');document.body.classList.remove('modal-open');
  setTimeout(()=>el.remove(),300);
}
function finishSetup(){
  const D=setup.data,s=state.settings,prev=s.prov?{...s.prov}:null;
  s.name=D.name.trim();s.theme=D.theme;s.showLunch=D.showLunch;s.setupDone=true;if(!s.setupAt)s.setupAt=Date.now();
  if(D.cls)s.prov={...(prev||{}),url:'calendar-data.js',cls:D.cls,lang:D.lang,includeAll:prev?.includeAll||false,error:''};
  save();applyTheme();closeSetup();
  if(route!=='dashboard')go('dashboard');else render(true);
  if(D.cls&&(!prev||prev.cls!==D.cls||prev.lang!==D.lang))syncAll(true);
}

function demoData(){
  const S=[['Matematik',COLORS[0]],['Engelska',COLORS[1]],['Biologi',COLORS[2]],['Historia',COLORS[3]],['Spanska',COLORS[4]]].map(([name,color])=>({id:uid(),name,color}));
  const [ma,en,bi,hi,sp]=S.map(s=>s.id),d=n=>addDays(todayStr(),n),ago=n=>Date.now()-n*864e5;
  const T=[
    {title:'Chapter 5 problem set',subjectId:ma,due:d(1),priority:'high',notes:'Exercises 5.1–5.24, show all working'},
    {title:'Essay draft: The Great Gatsby',subjectId:en,type:'Essay',due:d(3),notes:'1200 words'},
    {title:'Cell biology test',subjectId:bi,type:'Test',due:d(5),priority:'high',notes:'Chapters 3–4'},
    {title:'WWI source analysis',subjectId:hi,type:'Assignment',due:d(-1)},
    {title:'Vocabulary quiz',subjectId:sp,type:'Test',due:d(0),time:'10:15'},
    {title:'Group presentation: Cold War',subjectId:hi,type:'Presentation',due:d(9)},
    {title:'Lab report: Photosynthesis',subjectId:bi,type:'Project',due:d(12),status:'doing'},
    {title:'Read chapters 6–8',subjectId:en,type:'Reading',due:d(2),priority:'low'},
    {title:'Algebra test',subjectId:ma,type:'Test',due:d(-8),status:'done',grade:'B',completedAt:ago(8)},
    {title:'Poetry analysis',subjectId:en,type:'Essay',due:d(-12),status:'done',grade:'A',completedAt:ago(12)},
    {title:'Ecosystems quiz',subjectId:bi,type:'Test',due:d(-5),status:'done',grade:'C',completedAt:ago(5)},
    {title:'Industrial Revolution essay',subjectId:hi,type:'Essay',due:d(-15),status:'done',grade:'B',completedAt:ago(15)},
    {title:'Geometry test',subjectId:ma,type:'Test',due:d(-2),status:'done',completedAt:ago(2)}
  ].map(newTask);
  return{subjects:S,tasks:T};
}

// ---------- Theme ----------
function applyTheme(animate,t=state.settings.theme){
  const root=document.documentElement;
  if(animate){root.classList.add('theming');setTimeout(()=>root.classList.remove('theming'),500)}
  if(!t||t==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',t);
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}

// ---------- Events ----------
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-action]');if(!a)return;
  const {action,id,v}=a.dataset;
  switch(action){
    case 'nav':go(v);break;
    case 'add-task':
      if(a.dataset.d)taskModal(null,{due:a.dataset.d});
      else taskModal(null,{due:route==='calendar'?ui.calSel:''});break;
    case 'edit-task':e.stopPropagation();taskModal(id);break;
    case 'toggle-task':e.stopPropagation();toggleTask(id,a);break;
    case 'delete-task':{const snap=snapshot(),t=task(id);state.tasks=state.tasks.filter(x=>x.id!==id);if(t.source)state.ignored=[...(state.ignored||[]),t.source];save();closeModal();render(false);toast(`Deleted “${t.title}”`,()=>restore(snap));break}
    case 'add-subject':subjectModal();break;
    case 'edit-subject':subjectModal(id);break;
    case 'delete-subject':{const snap=snapshot(),s=subj(id);state.subjects=state.subjects.filter(x=>x.id!==id);state.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=''});if(ui.subject===id)ui.subject='all';save();closeModal();render(false);toast(`Deleted ${s.name}`,()=>restore(snap));break}
    case 'filter-subject':e.stopPropagation();ui.subject=id;ui.filter='upcoming';go('assignments');break;
    case 'filter':ui.filter=v;$$('#filterSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));{const l=$('#taskList');l.innerHTML=assignmentList();l.classList.remove('pop-in');void l.offsetWidth;l.classList.add('pop-in')}break;
    case 'goto-day':{ui.calSel=a.dataset.d;const dd=parse(a.dataset.d);ui.cal={y:dd.getFullYear(),mo:dd.getMonth()};go('calendar');break}
    case 'cal-move':{const n=+v;let {y,mo}=ui.cal;mo+=n;if(mo<0){mo=11;y--}if(mo>11){mo=0;y++}ui.cal={y,mo};ui.calDir=n;render(false);break}
    case 'cal-today':{const t=new Date(),dir=Math.sign((t.getFullYear()*12+t.getMonth())-(ui.cal.y*12+ui.cal.mo));ui.cal={y:t.getFullYear(),mo:t.getMonth()};ui.calSel=todayStr();ui.calDir=dir;render(false);break}
    case 'cal-day':{const k=a.dataset.d,d=parse(k);ui.calSel=k;
      if(d.getMonth()!==ui.cal.mo){ui.calDir=(d<new Date(ui.cal.y,ui.cal.mo,1))?-1:1;ui.cal={y:d.getFullYear(),mo:d.getMonth()};render(false)}
      else{$$('.cal-day').forEach(c=>c.classList.toggle('sel',c.dataset.d===k));const p=$('#dayPanel');p.innerHTML=dayPanel(state.tasks.filter(t=>t.due===k).sort(byDue));p.classList.remove('pop-in');void p.offsetWidth;p.classList.add('pop-in');
        if(matchMedia('(max-width:900px)').matches)p.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'})}
      break}
    case 'theme':state.settings.theme=v;save();applyTheme(true);$$('[data-action=theme]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
    case 'seg':{const g=a.closest('[data-seg]');$$('button',g).forEach(b=>b.classList.toggle('on',b===a));$('input',g).value=v;break}
    case 'swatch':{const g=a.parentElement;$$('.swatch',g).forEach(b=>b.classList.toggle('on',b===a));a.closest('form').color.value=v;break}
    case 'close':closeModal();break;
    case 'export':download(`studyboard-backup-${todayStr()}.json`,JSON.stringify(state,null,2),'application/json');state.settings.lastBackup=Date.now();save();render(false);toast('Backup saved to your Downloads');break;
    case 'backup-later':state.settings.backupSnooze=Date.now()+7*864e5;save();render(false);break;
    case 'import-backup':$('#fileBackup').click();break;
    case 'import-ics':$('#fileIcs').click();break;
    case 'sync':syncAll(true);break;
    case 'prov-disconnect':{const snap=snapshot();state.settings.prov=null;save();render(false);toast('Disconnected — your assignments are kept',()=>restore(snap));break}
    case 'disconnect':{const snap=snapshot();state.settings.icalUrl='';state.settings.itsOff=true;state.settings.syncError='';save();render(false);toast('itslearning disconnected — your assignments are kept',()=>restore(snap));break}
    case 'copy-share':copyText(SHARE_MESSAGE).then(ok=>toast(ok?'Message copied — paste it to your friend':'Couldn’t copy — your browser blocked it'));break;
    case 'copy-link':copyText(SITE_URL).then(ok=>toast(ok?'Link copied':'Couldn’t copy — your browser blocked it'));break;
    case 'load-demo':{if(state.tasks.length&&!confirm('Replace your current subjects and assignments with example data?'))break;
      const snap=snapshot();Object.assign(state,demoData());save();go('dashboard');toast('Example data loaded',()=>restore(snap));break}
    case 'clear-all':{if(!confirm('Delete ALL subjects and assignments? (You can undo right after.)'))break;
      const snap=snapshot();state.tasks=[];state.subjects=[];save();render(false);toast('Everything deleted',()=>restore(snap));break}
    // setup
    case 'open-setup':openSetup(+(a.dataset.step||0),false,true);break;
    case 'open-setup-fresh':openSetup(0,true,true);break;
    case 'reset-preview':if(confirm('Start the preview again from a fresh copy of your real Studyboard?')){try{localStorage.removeItem('studyboard.preview')}catch(e){}location.reload()}break;
    case 'su-next':if(!setup)break;if(setup.step===0)setup.data.name=$('#su-name')?.value||'';setup.step=Math.min(3,setup.step+1);setup.dir=1;renderSetup();break;
    case 'su-back':if(!setup)break;setup.step=Math.max(0,setup.step-1);setup.dir=-1;renderSetup();break;
    case 'su-skip':if(!setup)break;setup.data.cls=setup.initialCls;setup.step=2;setup.dir=1;renderSetup();break;
    case 'su-theme':if(!setup)break;setup.data.theme=v;applyTheme(true,v);renderSetup();break;
    case 'su-finish':if(setup)finishSetup();break;
    case 'su-close':applyTheme(true);closeSetup();break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('.overlay:not(.closing)')){closeModal();return}
  if(setup){
    if(e.key==='Escape'&&setup.closable){applyTheme(true);closeSetup()}
    if(e.key==='Enter'&&e.target.id==='su-name'){e.preventDefault();$('[data-action=su-next]')?.click()}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const f=$('.overlay:not(.closing) form');if(f){f.requestSubmit();return}}
  const tag=e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(tag)||e.ctrlKey||e.metaKey||e.altKey||$('.overlay'))return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();taskModal(null,{due:route==='calendar'?ui.calSel:''})}
  else if(e.key==='/'){e.preventDefault();if(route!=='assignments')go('assignments');setTimeout(()=>$('#q')?.focus(),80)}
  else if(e.key==='Enter'&&e.target.matches('.subj-card[data-id]'))subjectModal(e.target.dataset.id);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;$('#taskList').innerHTML=assignmentList()}
  if(e.target.id==='setName'){state.settings.name=e.target.value;save()}
  if(e.target.id==='su-name'&&setup)setup.data.name=e.target.value;
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='subjFilter'){ui.subject=e.target.value;render(false)}
  if(id==='provLang'&&state.settings.prov?.url){state.settings.prov.lang=e.target.value;save();syncAll(true)}
  if(id==='setLunch'){state.settings.showLunch=e.target.checked;save()}
  if(setup){
    if(id==='su-cls'){setup.data.cls=e.target.value;const b=$('[data-action=su-next]');if(b)b.disabled=!setup.data.cls}
    if(id==='su-lang')setup.data.lang=e.target.value;
    if(id==='su-lunch')setup.data.showLunch=e.target.checked;
  }
});
$('#fileIcs').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)importICS(await f.text())});
$('#fileBackup').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tasks))throw 0;
    if(state.tasks.length&&!confirm('Replace everything in Studyboard with this backup?'))return;
    const snap=snapshot();state={...blank(),...d,settings:{...blank().settings,...(d.settings||{}),setupDone:true}};save();applyTheme();render(true);toast('Backup restored',()=>restore(snap));
  }catch(err){toast('That file isn’t a Studyboard backup')}
});
addEventListener('resize',()=>renderNav());

// ---------- Start ----------
$('#brandMark').innerHTML=ic('openbook',21);
$('#fab').innerHTML=ic('plus',26);
$('#sideFoot').innerHTML=`<kbd>N</kbd> add something<br><kbd>/</kbd> search`;
applyTheme();
renderBanner();
render(true);
requestAnimationFrame(()=>requestAnimationFrame(()=>$('.app').classList.remove('no-anim')));
// Read what "Start Studyboard" downloaded. New here? Start the welcome setup.
loadDataFile().then(d=>{
  const s=state.settings;
  if(d?.its?.url&&!s.icalUrl&&!s.itsOff){s.icalUrl=d.its.url;save()}
  if(!s.setupDone){render(false);openSetup(0);return}
  if(hasSources())syncAll(false);else render(false);
});
// keep "today" fresh if the app is left open overnight
let lastDay=todayStr();setInterval(()=>{if(todayStr()!==lastDay){lastDay=todayStr();if(!$('.overlay')&&!setup)render(false)}},60000);
</script>
